name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  oldest-deps:
    # The suite wraps other people's engines, so it must run on the oldest
    # numpy and pandas that pyproject.toml allows, not only the locked ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install oldest allowed dependencies
        run: uv sync --python 3.12 --resolution lowest-direct
      - name: Test
        run: uv run --no-sync pytest
