[project]
name = "btbias"
version = "0.1.0"
description = "A test suite that checks daily-bar backtest engines for common biases on synthetic data with known answers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yang Yuming" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.ruff.lint.isort]
known-local-folder = ["builders", "vectorized_adapter", "vectorized_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
pythonpath = ["tests", "examples"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
